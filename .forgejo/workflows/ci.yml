# secret-guard — Forgejo Actions CI
#
# runner label: vm-nix (microvm, 由 git.lambda.lc 管理员注册).
# Rust 工具链直接装在 VM 里 (forgejo-runner-vm.mod.nix),
# CI 不走 nix develop (每次评估 flake + 补 store 太慢). 工具链版本由 VM 的 nixpkgs 决定.
#
# 触发去重 (与 ~/ws/nixos 的 ci 一致):
#   同一 commit 在 feature branch 上会同时触发 push + pull_request, 跑两次浪费 runner.
#   PR 事件总是跑 (合并前检查, 主要场景; draft/WIP PR 除外, 见 WIP 门禁); push 仅
#   master 跑 (合并后的 commit; feature branch 的 push 由 PR 覆盖). 另加
#   workflow_dispatch 供手动重试.
#
# WIP 门禁 (issue #204, 模式源自 nixos#791): draft PR (title 带 WIP:/[WIP] 前缀) 不触发
#   CI — WIP PR 离可合并尚远 (forgejo 本就按 WIP 前缀阻塞合并), 其上每次 push 的 check
#   纯属浪费; runner 单槽位且全 org 共享串行, 跳过即释放. 判定用 payload 的
#   pull_request.draft (forgejo 侧 = IsWorkInProgress(), 即阻塞合并的同一 SSOT — 前缀集/
#   大小写随实例 WORK_IN_PROGRESS_PREFIXES 配置自动对齐, workflow 侧不复制).
#   相关语义 (forgejo v15.0.7 源码核实, 详见 nixos#791):
#   - pre + check 双 job 都必须门禁: 只门禁 check 时 pre 会跑成功 → run 结论 success →
#     污染 skip-if-passed 内容去重 (去 WIP 后的补跑被误判 "已通过"). 全 job skipped →
#     run 结论 skipped (AggregateJobStatus 全 skip → skipped, 非 success) → 不污染.
#   - job 级 skip 的 commit status 按上游语义映射为绿色 ("Has been skipped"). 已知残余
#     窗口: 去 WIP (title 编辑) → edited 事件的覆盖 run 写入 pending 之间 (服务端健康时
#     亚秒, 无可乘之机); merge automation 侧已组织级根治 (CI 判定改查 action runs,
#     skipped run 不被采信, nixos#794).
#   - 衔接关键: forgejo 默认事件集 (opened/synchronize/reopened) 不含 title 编辑, 去 WIP
#     前缀必须显式订阅 edited (见 on.pull_request.types) 才能自动补跑 CI; "skip 门禁" 与
#     "edited 订阅" 在同一 ci.yml 版本内原子共存 (同一 head SHA 只有一份 workflow), 不存在
#     "被 skip 过的 SHA 拿不到补跑" 的窗口.
#   - WIP 化的 edited 事件经同 concurrency group 取消在跑 CI (符合 "标记 draft 即停止烧
#     CI" 语义).
#
# 内容去重 (skip-if-passed): ff-merge 后 commit SHA 不变, master 的 push 会重复触发
#   已跑过的 CI. pre job 查 Forgejo API 历史 run, 命中则 check job 跳过 (连 checkout 都不执行).
#   (与 ~/ws/nixos 同源经验; 逻辑等价的 composite action 见 lc-studio/forgejo-actions,
#   但本实例 DISABLE_HTTP_GIT + runner 零凭据无法跨仓库 clone action, 故内联)
#
# workflow `name: ci` + job_id `check` 对齐 branch protection 规则 "ci / check (*)",
# 通配符 (*) 同时覆盖 (push) 与 (pull_request) 两种事件后缀, 门禁不会因多事件分裂.
# `pre` job 产生 `ci / pre (*)` check, 但因 step continue-on-error 兜底,
# 该 check 对 PR 事件恒为 success, 不影响 branch protection (无需加入 required list).
#
# checkout 直接用 git + SSH (不用 actions/checkout):
#   forgejo 实例启用了 DISABLE_HTTP_GIT=true (禁止 git over HTTPS), 且内置 SSH server
#   要求用户名 forgejo (不是 git) + 非标准端口 5522. actions/checkout@v4 硬编码 git@ 用户
#   且 SCP-style URL 无法嵌端口, 对此环境完全不兼容. 直接 git 命令把用户名和端口写在
#   ssh:// URL 里 (forgejo@git.lambda.lc:5522), 一步到位, 无黑盒.
#   host key 用 ssh-keyscan 每次动态获取 (runner 在可信 MicroVM, LAN 可信, 首次即信任).
#   依赖一个 repo-level secret: DEPLOY_KEY (ed25519 私钥; 公钥在 repo Deploy keys 注册).
name: ci

on:
  push:
  pull_request:
    # 前 3 项为 forgejo 服务端默认事件集 (显式列出); edited 为 WIP 门禁衔接 —
    # 去 WIP 前缀 (PR ready) 时补跑 CI, 机制见文件头 "WIP 门禁".
    # 注: synchronize 是 forgejo 的转换名 (非 synchronized); edited 亦覆盖 body 编辑
    # (与 title 编辑共用通知路径), 同 SHA 已成功 run 会被内容去重秒过, 在跑期间编辑则
    # 经 concurrency 取消重启.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: # 手动重试: forgejo UI → Actions → ci → Run workflow

# PR 并发去旧 (issue #149-2): 同 PR 快速多次 push 时, 旧 run 的结果已无意义 (会被新
# push 覆盖), 却在 runner single-job 假设下串行占用 runner, 让最新 push 的反馈延迟
# 20min+. 按 PR number 分组 + cancel-in-progress 取消旧 run, 最新 push 立即开跑.
# 非 PR 事件 (push master / dispatch) 的 group fallback 到 commit sha — push 与
# dispatch 同 SHA 同在飞行中时后者会取消前者 (窗口极窄, 属良性 — 手动重试通常正是
# 想取代在飞的自动 run). 注意: 这是 "同一 PR 的 run 之间" 去重, 与 runner 层
# single-job 互斥 (见 check job env 段注释) 正交 — 后者约束 "不同 run 之间" 的并发.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre:
    runs-on: vm-nix
    # workflow_dispatch 不查 skip (手动重跑应无条件执行); push 仅 master 才查;
    # draft (WIP) PR 跳过 — pre 也必须门禁, 否则 pre 跑成功 → run 结论 success →
    # 污染内容去重 (见文件头 "WIP 门禁")
    if: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'push' || github.ref == 'refs/heads/master') && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    permissions:
      actions: read # 查 workflow runs API 需要
    outputs:
      should_skip: ${{ steps.s.outputs.should_skip }}
    steps:
      - id: s
        # 查当前 commit 是否已有成功的 workflow run; 失败退化为不跳过 (不阻断 CI)
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          count=$(curl -sf -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/actions/runs?head_sha=$SHA&status=success&limit=50" \
            | jq '[.workflow_runs[] | select(.workflow_id == "ci.yml")] | length')
          if [ "$count" -gt 0 ] 2>/dev/null; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ 跳过: commit ${SHA:0:8} 已有成功的 ci workflow run 记录"
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "→ 不跳过: commit ${SHA:0:8} 无成功记录, 正常执行"
          fi

  check:
    needs: pre
    runs-on: vm-nix
    # 双重去重 + WIP 门禁: 事件去重 (push 仅 master) + 内容去重 (已有成功记录则跳过) +
    # draft (WIP) PR 跳过 (见文件头 "WIP 门禁");
    # workflow_dispatch 直通 (pre 被 skip 时 should_skip 为空, != 'true' 仍跑)
    if: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/master') && needs.pre.outputs.should_skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    # 冷启动预算 (issue #149-1): 持久卷全清后需串行完成 debug 插桩编译 (~20min) →
    # 测试 → release LTO bench (10-20min) → playwright → audit → nix build
    # (冷 store 全量 vendor 编译, 自身 timeout 30min), 双冷 (卷+store 同时重建,
    # 仅 VM 首建/重建时出现) 场景总计可达 ~70min. 取 75min 留余量 (正常热路径 ~10min,
    # 单冷启动 ~45-50min). 注意 job timeout 是硬上限, 超时算 job failure 会阻塞合并,
    # continue-on-error 救不了 — 预算必须把非阻塞 step 的最坏耗时也计入. 不拆独立
    # bench/nix job: 拆 job 会丢 CARGO_TARGET_DIR 跨步复用 (release 缓存与 debug 缓存
    # 同卷) 且多一次 checkout, 改动成本高于调 timeout.
    timeout-minutes: 75
    # 评论 PR 需要 write 权限 (仅 PR 事件下的 diff 报告 step 用). Forgejo Actions 自动注入
    # GITHUB_TOKEN 默认有此权限, 显式声明遵循最小权限原则.
    permissions:
      pull-requests: write
    # cargo-llvm-cov 依赖 llvm-cov / llvm-profdata (rust 工具链不含). VM 的 systemPackages
    # 落 /run/current-system/sw/bin (NixOS 约定), job 级 env 让所有 step 共享, 无需各自 export.
    #
    # CARGO_TARGET_DIR 指向 runner VM 的持久卷, 跨 job 复用编译产物.
    # 完整机制 (卷生命周期 / 子目录隔离 / 串行保证) 见 AGENTS.md "CI" 段.
    #
    # 并发互斥假设 (issue #86 子项 #4): 本 workflow 假设 runner vm-nix 同一时刻只跑一个 job
    # (即 runner 注册时 concurrency 设为 1, 或 forgejo-runner 配置 single-job mode).
    # 若该假设不成立 (runner 允许并发 job), 两个 job 同时写同一 CARGO_TARGET_DIR 会触发
    # cargo `Blocking waiting for file lock` (慢) 或产物交错污染. 该假设的确认在 nixos 仓库
    # forgejo-runner-vm.mod.nix (本仓库不可见); 若未来 runner 改为多并发, 需在此加
    # `concurrency: { group: ci-vm-nix, cancel-in-progress: false }` 串行化所有 CI run,
    # 或改 CARGO_TARGET_DIR 按 run_id 隔离 (但会丢跨 job 缓存复用, 编译变慢).
    env:
      LLVM_COV: /run/current-system/sw/bin/llvm-cov
      LLVM_PROFDATA: /run/current-system/sw/bin/llvm-profdata
      CARGO_TARGET_DIR: /var/lib/forgejo-runner/cache/cargo-target
    steps:
      # ─── single-job 假设的运行时防御 (issue #149-7) ─────────────────────────
      # 在 cache 卷根 (CARGO_TARGET_DIR 的父目录) 写 run_id 锁文件, job 结束时校验
      # 未被覆盖. 不放在 CARGO_TARGET_DIR 内 — 卷级全清清理 (`rm -rf
      # $CARGO_TARGET_DIR/*`, 见 runner VM 侧 cache-reclaim 定时服务, nixos 仓库
      # forgejo-runner-vm.mod.nix) 会连带删掉它, 导致释放校验误报.
      # 若 runner 未来改为多并发 (假设破裂), 两个 job 交替写同一 target dir:
      # 后启动的 job 覆盖锁文件, 先启动的 job 结束时校验失败 → 把 "静默产物污染 /
      # 偶现怪异失败" 转化为带指向性的硬失败. 届时按上方 env 段注释的应对预案改造
      # (串行化或按 run_id 隔离), 然后可移除本防御.
      # 放在所有 step 之前 (checkout 也可能写 target dir).
      # 锁路径从 CARGO_TARGET_DIR 派生 (卷根), 末尾的 verify step 同源派生 — 两处联动.
      - name: Guard single-job assumption (acquire target-dir lock)
        id: lock
        run: |
          set -eu
          : "${CARGO_TARGET_DIR:?}" # 防御本地摘脚本复现: 未设时锁会静默落到 cwd
          LOCK="$(dirname "$CARGO_TARGET_DIR")/.ci-target-dir-lock"
          mkdir -p "$(dirname "$LOCK")"
          echo "$GITHUB_RUN_ID" > "$LOCK"
          echo "lock: acquired target dir for run $GITHUB_RUN_ID (lock=$LOCK)"

      # PR 事件需要 fetch base+head 以支持三点 diff (origin/<base>...HEAD);
      # 其他事件 (push master / workflow_dispatch) 无 diff 需求, 保持浅克隆 --depth 1 省时.
      - name: Checkout via SSH
        id: checkout
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 5522 git.lambda.lc >> ~/.ssh/known_hosts
          git init
          git remote add origin "ssh://forgejo@git.lambda.lc:5522/${GITHUB_REPOSITORY}.git"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git fetch --no-tags origin "$GITHUB_SHA"
          else
            git fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git checkout "$GITHUB_SHA"

      # ─── PR diff 拆解 (仅 PR 事件, 附加功能, 真正非阻塞) ──────────────────
      # 放在 check 之前: 让 review 时尽早看到 prod/test 膨胀分析, 不必等编译+测试跑完.
      # 工具 rust-diff-analyzer 由 runner VM 的 systemPackages 提供 (见 nixos 仓库
      # rust.mod.nix), 不需要 install step.
      #
      # 真正非阻塞 (continue-on-error: true): 即使这些 step 失败 (网络/工具/API 抽风),
      # 也不影响 check job 状态, 不阻塞合并 —— 遵循"附加功能不影响核心职责"的鲁棒性原则.
      # if 条件四重与:
      #   always()                          — 即使 check/coverage 失败也跑 (review 时仍想看膨胀)
      #   github.event_name == 'pull_request' — 非 PR 事件无 diff 可分析
      #   steps.checkout.outcome == 'success' — checkout 挂了没代码可分析, 不进入 (避免发空评论)
      - name: Generate diff breakdown report
        id: report
        if: always() && github.event_name == 'pull_request' && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # --format comment: 输出 markdown, 适合 PR 评论.
          # --no-fail: 工具自身不因检测到膨胀而退出非零.
          {
            echo "body<<EOF"
            git diff "origin/$BASE_REF...HEAD" | rust-diff-analyzer --format comment --no-fail
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 评论用纯 curl + Forgejo API (curl 是零依赖的 shell 命令, 比 JS action 更轻量).
      # upsert 语义: 用 HTML marker 标记评论, 找到则 PATCH 更新 (PR 多次 push 不刷屏),
      # 找不到则 POST 新建. 额外守卫 steps.report.outcome == 'success': 报告没生成就不发空评论.
      # API base 用 github.api_url (与 pre job 同源, 避免实例地址硬编码漂移).
      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request' && steps.report.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ steps.report.outputs.body }}
        run: |
          set -eu
          MARKER='<!-- rust-diff-analyzer -->'
          FULL_BODY="$MARKER"$'\n'"$BODY"
          API="$API_BASE/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"

          # 1. 查找已有评论 (按 marker 识别).
          EXISTING_ID=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | jq --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' | head -1)

          # 2. upsert: 找到 → PATCH 更新; 没找到 → POST 新建.
          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')
          if [ -n "$EXISTING_ID" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API/$EXISTING_ID" >/dev/null
            echo "Updated comment $EXISTING_ID"
          else
            curl -fsSL -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API" >/dev/null
            echo "Created new comment"
          fi

      # ─── 工具链版本留痕 (issue #149-5b) ─────────────────────────────────────
      # CI 工具链由 VM nixpkgs 决定, 三源 (CI/devShell/rust-toolchain.toml) 漂移时
      # clippy 新 lint 可无预警阻塞所有 PR. 本 step 把 rustc 版本写入 step output,
      # 由 Diagnose 评论携带, 留下每次 run 的工具链快照 (事后可追溯 "哪天升了").
      # 放在首个阻塞 step 之前 + if: always() — 核心动机场景正是 "后续 step 因新
      # lint 失败", 那时本 step 必须已跑过 (若放阻塞 step 之后会被 skip, 拿不到版本).
      # rustc --version 零依赖秒级, 不需要 checkout.
      # 选择并入 diag 评论而非独立评论/artifact: 零额外 API 调用, 成本最低.
      # MSRV 下界的 SSOT 在 Cargo.toml rust-version (issue #149-5a).
      - name: Record toolchain version
        id: toolchain
        if: always()
        run: |
          set -eu
          RUSTC_VERSION=$(rustc --version)
          echo "rustc_version=$RUSTC_VERSION" >> "$GITHUB_OUTPUT"
          echo "toolchain snapshot: $RUSTC_VERSION"

      # (cache 卷的防满回收不在此处: 由 runner VM 侧的 cache-reclaim 定时服务统一
      # 负责 — 多 repo 共享同一卷, 回收逻辑收敛在基础设施层, 各 workflow 保持纯粹.
      # 见 nixos 仓库 forgejo-runner-vm.mod.nix. 2026-08-24 ENOSPC 事故的教训记录:
      # 旧版 CI 内嵌 Reclaim step 只清 profraw 且全清阈值 1G 过低, 挡不住 cargo
      # 陈旧依赖产物的无界累积.)

      # consistency-check feature 守卫: clippy + nextest 带 feature flag 跑一次.
      # 该 feature 是默认关闭的 CI 守卫 (视图正确性断言, 详见 AGENTS.md "视图正确性确保机制"),
      # 必须显式启用才能让断言执行. 单独成步, 复用 checkout; 在 coverage 步骤的 cargo clean 前,
      # 不影响磁盘峰值控制 (target/debug 与 coverage 的 target/llvm-cov-target 互不复用).
      - name: consistency-check feature guard
        id: consistency
        run: just check-features

      # just check --coverage: fmt + clippy + machete + doc 门禁 + 测试 (插桩编译, 产出
      # profdata 供 coverage-gate 消费) + typos + deny-offline. 测试集只跑这一次 (而非
      # check 跑一次 + coverage-gate 再跑一次). typos/deny-offline 不设独立 step
      # (见下方 cargo-deny+typos 说明块), 在本 step 链尾失败时 Diagnose 表显示
      # coverage=failure, 需翻 log 末尾区分具体挂在哪一环 (typos / deny-offline / doc / 测试).
      - name: Check + coverage data
        id: coverage
        run: just check --coverage

      # 覆盖率门禁: 双阈值 (line% 下限 + 未覆盖行数上限), 阈值 SSOT 在 justfile.
      # 只做 report (读上一步的 profdata), 不重跑测试.
      - name: Coverage gate
        id: coverage_gate
        run: just coverage-gate

      # Performance benchmark (criterion baseline 回归检测, 非阻塞).
      # 机制实现 + 阈值/输出契约/退出码 SSOT 在 justfile bench-ci; 此处只记 CI 层决策:
      #   - 双事件分流 (复用本 job 的事件判定): master push → bench-ci save (滚动基线),
      #     PR → bench-ci compare (只对比). 基线冷启动自动 fallback (见 justfile bench-ci).
      #   - continue-on-error: 与 WebUI regression 同策略, 退化不阻断合并 (防 --quick
      #     噪声 flake 误伤). 退化信号 upsert 到 PR 评论供人工判断. 升级路径: 连续
      #     N=20 次 master push 无误报后可移除 PR 的 continue-on-error.
      #   - 缓存: CARGO_TARGET_DIR/{release,criterion}/ 跨 job 复用 (master 建立的基线
      #     PR 直接对比), 冷启动仅在持久卷重建后出现.
      - name: Performance benchmark (criterion baseline)
        id: bench
        continue-on-error: true
        run: |
          set +e  # 捕获 bench-ci 的退化退出码 (exit 1) 供下一步判定, 不被 set -e 提前终止
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            just bench-ci compare 2>&1 | tee bench.txt
          else
            just bench-ci save 2>&1 | tee bench.txt
          fi
          EXIT=${PIPESTATUS[0]}
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # 归档输出供评论 step 消费 (无论成败都贴, 便于维护者确认 bench 跑了 + 看趋势)
          {
            echo "report<<EOF"
            cat bench.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0  # continue-on-error 已兜底, 这里永远成功

      # bench 结果 upsert 到 PR 评论 (仅 PR 事件): 复用 diff-loc/audit 的 marker 机制.
      # 真正非阻塞 (continue-on-error: true): API/网络失败不影响合并.
      # 仅 PR compare 模式且有输出时贴评论 (master save 模式无回归判定, 不需要评论).
      - name: Upsert benchmark report to PR
        if: always() && github.event_name == 'pull_request' && steps.bench.outputs.exit_code != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.bench.outputs.exit_code }}
          REPORT: ${{ steps.bench.outputs.report }}
        run: |
          set -eu
          MARKER='<!-- bench-regression -->'
          if [ "$EXIT_CODE" = "1" ]; then
            ICON="⚠️"
            VERDICT="检测到性能退化 (中位数 > 阈值, 见 justfile bench-ci)"
          elif [ "$EXIT_CODE" = "2" ]; then
            ICON="❌"
            VERDICT="bench 运行失败 (编译/运行错误, 非退化)"
          else
            ICON="✅"
            VERDICT="无场景退化超阈值"
          fi
          # 提取 change 摘要行 (compact, 避免贴整段输出):
          # 抓 bench id 行 (泛匹配 ^[a-z], 与 justfile awk 对齐, 新增 bench 场景自动覆盖)
          # + change 百分比行 (含 %). 完整 report 在 CI log 里可查, 评论只放关键趋势.
          SUMMARY=$(echo "$REPORT" | grep -E '^[a-z]|^[[:space:]]+time:[[:space:]]+\[[^]]*%' | tail -40)
          BODY="$ICON **benchmark**: $VERDICT."$'\n\n```\n'"$SUMMARY"$'\n```'
          FULL_BODY="$MARKER"$'\n'"$BODY"
          API="$API_BASE/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"

          EXISTING_ID=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | jq --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' | head -1)

          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')
          if [ -n "$EXISTING_ID" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API/$EXISTING_ID" >/dev/null
            echo "Updated bench comment $EXISTING_ID"
          else
            curl -fsSL -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API" >/dev/null
            echo "Created new bench comment"
          fi

      # 文件长度门禁: 防止单文件 prod 代码失控膨胀 (拆分 ROI 为负时的早期预警).
      # 用 rust-diff-analyzer 对每个 .rs 做 AST 分类, 只统计 prod 行数 (排除 test).
      # 依赖 rust-diff-analyzer (runner VM systemPackages 提供, 同 diff-loc 步).
      # 双阈值: 超 FILE_WARN_PROD_LINES (500) 报 warning 不阻断; 超 FILE_MAX_PROD_LINES
      # (1600) 则 exit 1 阻断. 不依赖编译产物, 放最后作为补充守卫.
      - name: File size gate
        id: filesize
        run: just check-file-size

      # WebUI 回归测试 (Playwright 端到端).
      # webServer 自动启动 mock upstream + secret-guard, 复用上一步编译的 debug binary
      # (CARGO_TARGET_DIR 指向持久卷, playwright.config.ts 读此环境变量).
      #
      # 初期 continue-on-error: true — Playwright 在 CI 环境 (无 GPU / chromium 渲染稳定性)
      # 可能有 flake, 不阻塞合并. 稳定后改为阻塞.
      #
      # 退出条件 (issue #86 子项 #2): 当连续 N=20 次 master 分支 (push 事件) 本 step 跑绿,
      # 移除 continue-on-error 升级为阻塞. 判定方式: 翻 Actions 历史, 筛 master + WebUI step,
      # 取最近 20 次全绿即达标. 升级前先在本 PR 评论记录达标证据 (20 次 run 链接).
      # 未达标前, 维护者合并 PR 时需人工核对 CI log 中 WebUI step 是否非绿 (CI 不阻断).
      #
      # 前置 (forgejo-runner-vm.mod.nix 的 VM PATH 已含 playwright-test nodejs python3):
      # 见 ~/ws/nixos/private/pubserv/forgejo-runner-vm.mod.nix.
      - name: WebUI regression (Playwright)
        id: playwright
        continue-on-error: true
        run: |
          set +e  # 捕获 playwright 退出码 (continue-on-error 兜底, 这里永不失败)
          just check-webui 2>&1 | tee webui.txt
          EXIT=${PIPESTATUS[0]}
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          {
            echo "report<<EOF"
            # 失败时贴末尾 80 行 (错误摘要通常在尾部; 完整 log 在 CI artifact); 成功贴一行.
            if [ "$EXIT" -ne 0 ]; then
              tail -80 webui.txt
            else
              grep -E 'passed|flaky|did not run' webui.txt | tail -5
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0

      # WebUI 结果 upsert 到 PR 评论 (issue #149-4): 照抄 bench/audit 的 marker 机制,
      # 修复可见性不对称 — WebUI 是 continue-on-error 非阻塞 step, 失败若只埋在
      # job log + artifact, "连续 N=20 次绿 → 转阻塞" 的升级判据 (#86-2) 永远无人察觉.
      # 评论让每次 run 的 WebUI 状态在 PR 上可见, 维护者合并前一眼确认.
      - name: Upsert WebUI result to PR
        if: always() && github.event_name == 'pull_request' && steps.playwright.outputs.exit_code != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.playwright.outputs.exit_code }}
          REPORT: ${{ steps.playwright.outputs.report }}
        run: |
          set -eu
          MARKER='<!-- webui-regression -->'
          if [ "$EXIT_CODE" = "0" ]; then
            ICON="✅"
            VERDICT="WebUI 回归测试通过"
          else
            ICON="⚠️"
            VERDICT="WebUI 回归测试失败 (非阻塞, 合并前请人工核对; artifact 见 Upload Playwright artifacts)"
          fi
          BODY="$ICON **webui**: $VERDICT."$'\n\n```\n'"$REPORT"$'\n```'
          FULL_BODY="$MARKER"$'\n'"$BODY"
          API="$API_BASE/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"

          EXISTING_ID=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | jq --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' | head -1)

          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')
          if [ -n "$EXISTING_ID" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API/$EXISTING_ID" >/dev/null
            echo "Updated webui comment $EXISTING_ID"
          else
            curl -fsSL -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API" >/dev/null
            echo "Created new webui comment"
          fi

      # WebUI 测试失败时上传 Playwright 产物 (截图/trace/html 报告) 供事后排查 (issue #86 子项 #2).
      # 仅在 Playwright step 失败时上传 (成功时不产生 artifact, 省存储).
      # 条件用 exit_code output 而非 outcome: playwright step 恒 exit 0 (continue-on-error
      # 已兜底, 输出捕获模式与 bench/audit 一致), outcome 恒为 success, 真实成败在 exit_code.
      # 用 Forgejo 官方 fork: GitHub 官方 actions/upload-artifact@v4 会检测非 GitHub 环境直接报错.
      # node20 是 action API 级别声明 (>=20 即可), VM 的 nodejs 24 满足 (act 执行 JS action
      # 只需 node 在 PATH, forgejo-runner-vm.mod.nix 已配).
      # artifact 存 Forgejo server 端 (默认本地 FS), 无需 server 侧配置. retention 见 with 段.
      - name: Upload Playwright artifacts on failure
        if: always() && steps.playwright.outputs.exit_code != '' && steps.playwright.outputs.exit_code != '0'
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: playwright-failure
          # just check-webui 在 repo 根执行, Playwright 默认产物路径 (见 .gitignore):
          path: |
            tests/webui/test-results/
            tests/webui/playwright-report/
          retention-days: 14

      # cargo audit: 监控依赖 CVE (项目处理 API key/token/密码, 安全敏感).
      # 工具: cargo-audit (devShell 已含; VM 通过 host-sw-bin fallback 提供).
      #
      # continue-on-error: true: 新 CVE 出现时不应阻塞正在进行的 PR (由维护者单独处理).
      # 数据库 advisory DB 拉取可能因网络抖动失败, 也不应阻塞.
      #
      # 输出捕获: tee 到 audit.txt 供下一步 upsert 到 PR 评论 (复用 diff-loc 的 marker 机制,
      # 让 CVE 不只埋在 job log, 维护者能在 PR 评审时直接看到).
      - name: cargo audit (CVE scan)
        id: audit
        continue-on-error: true
        env:
          # advisory DB 缓存到持久卷 (issue #149-3): 首次 clone 后跨 job 复用, 后续
          # 增量 fetch. cargo-audit 不认 CARGO_AUDIT_DB env (只认 --db flag), justfile
          # 的 audit recipe 显式透传该 env 到 --db, 使此缓存生效.
          CARGO_AUDIT_DB: /var/lib/forgejo-runner/cache/advisory-db
        run: |
          set +e  # 即使 audit 报告 CVE 也继续捕获输出 (cargo audit 发现漏洞会 exit 1)
          just audit 2>&1 | tee audit.txt
          EXIT=${PIPESTATUS[0]}
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          # 把报告归档到 step output 供下一步消费 (无 CVE 时也贴, 便于维护者确认 audit 真的跑了)
          {
            echo "report<<EOF"
            cat audit.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit 0  # continue-on-error 已兜底, 这里永远成功

      # audit 结果 upsert 到 PR 评论 (仅 PR 事件): 复用 diff-loc 的 marker 机制.
      # 真正非阻塞 (continue-on-error: true): API/网络失败不影响合并.
      # 动机见上方 audit step 的"输出捕获"注释 — 让非阻塞的 CVE 不只埋在 job log.
      - name: Upsert cargo audit report to PR
        if: always() && github.event_name == 'pull_request' && steps.audit.outputs.exit_code != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          set -eu
          MARKER='<!-- cargo-audit -->'
          if [ "$EXIT_CODE" = "0" ]; then
            BODY="✅ **cargo audit**: no vulnerabilities (excluding ignored advisories)."
          else
            BODY="⚠️ **cargo audit**: vulnerabilities found (exit $EXIT_CODE). Ignored advisories 见 \`.cargo/audit.toml\`."
          fi
          # 仅在有漏洞时贴完整报告 (无漏洞时一行摘要即可, 减少噪音)
          if [ "$EXIT_CODE" != "0" ]; then
            BODY="$BODY"$'\n\n```\n'"$REPORT"$'\n```'
          fi
          FULL_BODY="$MARKER"$'\n'"$BODY"
          API="$API_BASE/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"

          EXISTING_ID=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | jq --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' | head -1)

          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')
          if [ -n "$EXISTING_ID" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API/$EXISTING_ID" >/dev/null
            echo "Updated audit comment $EXISTING_ID"
          else
            curl -fsSL -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API" >/dev/null
            echo "Created new audit comment"
          fi

      # cargo-deny + typos (license 合规 / bans / sources / 拼写, **阻塞**):
      # 不设独立 step — 上方 `just check --coverage` 链尾已运行同一组确定性离线命令
      # (just deny-offline + just typos, 见 justfile check recipe), 独立 step 只可能
      # "check 内失败后被 skip" 或 "check 内通过后重跑必过", 永远不产生独立失败信号,
      # 反而把失败归属混进 coverage step (issue #149-3/-8 的联动设计).
      # 本地 `just check` 链尾跑同一命令, 保证本地全绿 ⇒ CI 阻塞项必绿.
      # 全量 deny (含联网 advisories) 本地用 `just deny`; 配置见 deny.toml / _typos.toml,
      # 详见根 AGENTS.md "cargo-deny" 段.

      # ─── nix package 验证 (issue #149-6, 非阻塞起步) ────────────────────────
      # 验证 nix/package.nix 的 cargoHash 与 Cargo.lock 一致 (漂移时部署侧 ~/ws/nixos
      # 重建才暴露, 排障跨仓库). runner 是 NixOS microvm 天然有 nix; store 缓存跨 job
      # 复用, 热路径增量仅重编 workspace crate.
      # continue-on-error: true (非阻塞起步): 首次/依赖大版本升级时全量 vendor 编译
      # 较慢, 且 cargoHash 过期是已知高频事件 (升级依赖的 PR 必然触发).
      # 转阻塞判据: 连续 N=20 次 master push 本 step 跑绿后, 移除 continue-on-error
      # (判定方式同 WebUI step: 翻 Actions 历史筛 master + 本 step 取最近 20 次全绿).
      # 注意: 依赖升级 PR 会合法地使 cargoHash 过期 → 本 step 失败属预期信号 (提醒
      # 同步 nix/package.nix), 不应因非阻塞而被忽视, 维护者需人工关注.
      - name: nix build (cargoHash validation)
        id: nixbuild
        continue-on-error: true
        timeout-minutes: 30
        # --extra-experimental-features: runner 的 Lix 未启用 nix-command/flakes
        # (2026-08-26 #193 首跑实证; 本 step continue-on-error, 之前失败被掩盖).
        run: nix --extra-experimental-features "nix-command flakes" build .#secret-guard -L

      # 注: nix flake checks (render 契约) 不设 CI step — runner VM 架构禁止
      # nix 求值 (无 writableStoreOverlay / 无 nix-daemon, 见 forgejo-runner-vm.mod.nix
      # 文件头「CI 工具链规范」; 2026-08-26 #193 首跑实证: 先撞 experimental-features,
      # 开启后仍会撞只读 store / 无法 fetch input). serde 漂移门禁由本地 just check
      # 链尾的 just nix-check 承担 (recipe 内探测 nix-daemon, CI 环境自动跳过).

      # 诊断 step: job 失败时把所有阻塞 step 的 outcome 汇总贴到 PR 评论,
      # 帮助无 admin 权限的 contributor 定位失败 step (无日志访问权限时的 fallback).
      # 仅 PR 事件 + job 失败时触发. continue-on-error 兜底 (评论失败不影响 job 状态).
      # 工具链版本 (issue #149-5b) 携带在此评论: 每次失败留痕 rustc 版本, 便于事后
      # 追溯 "三源漂移" 类问题 (clippy 新 lint 突然阻塞).
      - name: Diagnose failure (post step outcomes to PR)
        if: always() && failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          {
            echo "## 🔍 CI 诊断报告 (step outcomes)"
            echo ""
            echo "**Toolchain**: ${{ steps.toolchain.outputs.rustc_version || 'unknown (step skipped)' }}"
            echo ""
            echo "| Step | id | Outcome |"
            echo "|------|----|---------|"
            echo "| Guard lock | lock | ${{ steps.lock.outcome }} |"
            echo "| consistency-check | consistency | ${{ steps.consistency.outcome }} |"
            echo "| Check+coverage (含 doc/--locked/typos/deny-offline) | coverage | ${{ steps.coverage.outcome }} |"
            echo "| Coverage gate | coverage_gate | ${{ steps.coverage_gate.outcome }} |"
            echo "| File size | filesize | ${{ steps.filesize.outcome }} |"
            echo "| nix build | nixbuild | ${{ steps.nixbuild.outcome }} |"
            echo ""
            echo "(bench/playwright/audit 有 continue-on-error 且各有 PR 评论, 不列;"
            echo " nixbuild 虽同为非阻塞, 但特意列出 — cargoHash 漂移高频且无独立评论.)"
            echo ""
            echo "**Job status**: ${{ job.status }}"
            echo "**Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/diag.md
          MARKER='<!-- ci-diagnose -->'
          BODY="$(cat /tmp/diag.md)"
          FULL_BODY="$MARKER"$'\n'"$BODY"
          API="$API_BASE/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')
          curl -fsSL -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$API" >/dev/null && echo "Diag comment posted" || echo "POST diag comment failed (non-fatal)"

      # ─── single-job 假设的运行时防御: 释放校验 (issue #149-7) ────────────────
      # 校验锁文件未被覆盖 (被覆盖 = 有第二个 job 并发写了同一 target dir, 假设破裂).
      # if: always() — 无论 job 成败都校验 (污染检测优先于成败判定). 失败消息指向
      # 上方 env 段的并发假设注释, 维护者可按预案改造. 放在最后: 需等所有写 target
      # dir 的 step 结束后校验才有意义. 锁路径与开头的 acquire step 同源派生 (卷根).
      - name: Guard single-job assumption (verify target-dir lock)
        if: always()
        run: |
          set -eu
          : "${CARGO_TARGET_DIR:?}" # 防御本地摘脚本复现: 未设时锁会静默落到 cwd
          LOCK="$(dirname "$CARGO_TARGET_DIR")/.ci-target-dir-lock"
          CURRENT=$(cat "$LOCK" 2>/dev/null || echo "MISSING")
          if [ "$CURRENT" = "MISSING" ]; then
            echo "::error::target-dir lock file missing: $LOCK (deleted mid-job? volume wiped?)."
            echo "锁文件在 job 开始时由 acquire step 写入, 正常路径不可能消失 — 排查卷状态."
            exit 1
          fi
          if [ "$CURRENT" != "$GITHUB_RUN_ID" ]; then
            echo "::error::target-dir lock file corrupted: expected run $GITHUB_RUN_ID, got '$CURRENT'."
            echo "另一个 job 并发写了同一 CARGO_TARGET_DIR — runner single-job 假设已破裂."
            echo "按本 job env 段 '并发互斥假设' 注释的预案处理 (串行化 concurrency 或按 run_id 隔离),"
            echo "详见 .forgejo/workflows/ci.yml 与 docs/ci.md '并发互斥假设' 段."
            exit 1
          fi
          echo "lock: verified (run $GITHUB_RUN_ID, no concurrent writer)"

      # 历史: 早期曾用 "Bench compile check (release, --no-run)" 方案, 因 release 全量编译慢而移除;
      # 后改为 "dev profile --no-run" (上方已进一步升级为完整 bench 运行). 此处保留备选记录.
      # - name: Bench compile check (release --no-run)
      #   continue-on-error: true
      #   run: just check-benches
