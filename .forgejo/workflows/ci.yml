# secret-guard — Forgejo Actions CI
#
# runner label: vm-nix (microvm, 由 git.lambda.lc 管理员注册).
# Rust 工具链直接装在 VM 里 (forgejo-runner-vm.mod.nix),
# CI 不走 nix develop (每次评估 flake + 补 store 太慢). 工具链版本由 VM 的 nixpkgs 决定.
#
# 触发去重 (与 ~/ws/nixos 的 ci 一致):
#   同一 commit 在 feature branch 上会同时触发 push + pull_request, 跑两次浪费 runner.
#   PR 事件总是跑 (合并前检查, 主要场景); push 仅 master 跑 (合并后的 commit; feature
#   branch 的 push 由 PR 覆盖). 另加 workflow_dispatch 供手动重试.
#
# workflow `name: ci` + job_id `check` 对齐 branch protection 规则 "ci / check (*)",
# 通配符 (*) 同时覆盖 (push) 与 (pull_request) 两种事件后缀, 门禁不会因多事件分裂.
#
# checkout 直接用 git + SSH (不用 actions/checkout):
#   forgejo 实例启用了 DISABLE_HTTP_GIT=true (禁止 git over HTTPS), 且内置 SSH server
#   要求用户名 forgejo (不是 git) + 非标准端口 5522. actions/checkout@v4 硬编码 git@ 用户
#   且 SCP-style URL 无法嵌端口, 对此环境完全不兼容. 直接 git 命令把用户名和端口写在
#   ssh:// URL 里 (forgejo@git.lambda.lc:5522), 一步到位, 无黑盒.
#   host key 用 ssh-keyscan 每次动态获取 (runner 在可信 MicroVM, LAN 可信, 首次即信任).
#   依赖一个 repo-level secret: DEPLOY_KEY (ed25519 私钥; 公钥在 repo Deploy keys 注册).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch: # 手动重试: forgejo UI → Actions → ci → Run workflow

jobs:
  check:
    runs-on: vm-nix
    # 去重: PR 事件总是跑; push 事件仅 master 跑 (feature branch 的 push 会被 pull_request 覆盖)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/master' }}
    timeout-minutes: 20
    # 评论 PR 需要 write 权限 (仅 PR 事件下的 diff 报告 step 用). Forgejo Actions 自动注入
    # GITHUB_TOKEN 默认有此权限, 显式声明遵循最小权限原则.
    permissions:
      pull-requests: write
    # cargo-llvm-cov 依赖 llvm-cov / llvm-profdata (rust 工具链不含). VM 的 systemPackages
    # 落 /run/current-system/sw/bin (NixOS 约定), job 级 env 让所有 step 共享, 无需各自 export.
    #
    # CARGO_TARGET_DIR 指向 runner VM 的持久卷, 跨 job 复用编译产物.
    # 完整机制 (卷生命周期 / 子目录隔离 / 串行保证) 见 AGENTS.md "CI" 段.
    env:
      LLVM_COV: /run/current-system/sw/bin/llvm-cov
      LLVM_PROFDATA: /run/current-system/sw/bin/llvm-profdata
      CARGO_TARGET_DIR: /var/lib/forgejo-runner/cache/cargo-target
    steps:
      # PR 事件需要 fetch base+head 以支持三点 diff (origin/<base>...HEAD);
      # 其他事件 (push master / workflow_dispatch) 无 diff 需求, 保持浅克隆 --depth 1 省时.
      - name: Checkout via SSH
        id: checkout
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 5522 git.lambda.lc >> ~/.ssh/known_hosts
          git init
          git remote add origin "ssh://forgejo@git.lambda.lc:5522/${GITHUB_REPOSITORY}.git"
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            git fetch --no-tags origin "$GITHUB_SHA"
          else
            git fetch --depth 1 origin "$GITHUB_SHA"
          fi
          git checkout "$GITHUB_SHA"

      # ─── PR diff 拆解 (仅 PR 事件, 附加功能, 真正非阻塞) ──────────────────
      # 放在 check 之前: 让 review 时尽早看到 prod/test 膨胀分析, 不必等编译+测试跑完.
      # 工具 rust-diff-analyzer 由 runner VM 的 systemPackages 提供 (见 nixos 仓库
      # rust.mod.nix), 不需要 install step.
      #
      # 真正非阻塞 (continue-on-error: true): 即使这些 step 失败 (网络/工具/API 抽风),
      # 也不影响 check job 状态, 不阻塞合并 —— 遵循"附加功能不影响核心职责"的鲁棒性原则.
      # if 条件四重与:
      #   always()                          — 即使 check/coverage 失败也跑 (review 时仍想看膨胀)
      #   github.event_name == 'pull_request' — 非 PR 事件无 diff 可分析
      #   steps.checkout.outcome == 'success' — checkout 挂了没代码可分析, 不进入 (避免发空评论)
      - name: Generate diff breakdown report
        id: report
        if: always() && github.event_name == 'pull_request' && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # --format comment: 输出 markdown, 适合 PR 评论.
          # --no-fail: 工具自身不因检测到膨胀而退出非零.
          {
            echo "body<<EOF"
            git diff "origin/$BASE_REF...HEAD" | rust-diff-analyzer --format comment --no-fail
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # 评论用纯 curl + Forgejo API (不引入 JS action — vm-nix 无 node).
      # upsert 语义: 用 HTML marker 标记评论, 找到则 PATCH 更新 (PR 多次 push 不刷屏),
      # 找不到则 POST 新建. 额外守卫 steps.report.outcome == 'success': 报告没生成就不发空评论.
      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request' && steps.report.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BODY: ${{ steps.report.outputs.body }}
        run: |
          set -eu
          MARKER='<!-- rust-diff-analyzer -->'
          FULL_BODY="$MARKER"$'\n'"$BODY"
          API="https://git.lambda.lc/api/v1/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"

          # 1. 查找已有评论 (按 marker 识别).
          EXISTING_ID=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | jq --arg m "$MARKER" '.[] | select(.body | contains($m)) | .id' | head -1)

          # 2. upsert: 找到 → PATCH 更新; 没找到 → POST 新建.
          PAYLOAD=$(jq -n --arg b "$FULL_BODY" '{body: $b}')
          if [ -n "$EXISTING_ID" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API/$EXISTING_ID" >/dev/null
            echo "Updated comment $EXISTING_ID"
          else
            curl -fsSL -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "$API" >/dev/null
            echo "Created new comment"
          fi

      # consistency-check feature 守卫: clippy + nextest 带 feature flag 跑一次.
      # 该 feature 是默认关闭的 CI 守卫 (视图正确性断言, 详见 AGENTS.md "视图正确性确保机制"),
      # 必须显式启用才能让断言执行. 单独成步, 复用 checkout; 在 coverage 步骤的 cargo clean 前,
      # 不影响磁盘峰值控制 (target/debug 与 coverage 的 target/llvm-cov-target 互不复用).
      - name: consistency-check feature guard
        run: just check-features

      # just check --coverage: fmt + clippy + machete + 测试 (插桩编译, 产出 profdata 供 coverage-gate 消费).
      # 测试集只跑这一次 (而非 check 跑一次 + coverage-gate 再跑一次).
      - name: Check + coverage data
        run: just check --coverage

      # 覆盖率门禁: 双阈值 (line% 下限 + 未覆盖行数上限), 阈值 SSOT 在 justfile.
      # 只做 report (读上一步的 profdata), 不重跑测试.
      - name: Coverage gate
        run: just coverage-gate

      # 文件长度门禁: 防止单文件 prod 代码失控膨胀 (拆分 ROI 为负时的早期预警).
      # 用 rust-diff-analyzer 对每个 .rs 做 AST 分类, 只统计 prod 行数 (排除 test).
      # 依赖 rust-diff-analyzer (runner VM systemPackages 提供, 同 diff-loc 步).
      # 双阈值: 超 FILE_WARN_PROD_LINES (500) 报 warning 不阻断; 超 FILE_MAX_PROD_LINES
      # (1600) 则 exit 1 阻断. 不依赖编译产物, 放最后作为补充守卫.
      - name: File size gate
        run: just check-file-size

      # WebUI 回归测试 (Playwright 端到端).
      # webServer 自动启动 mock upstream + secret-guard, 复用上一步编译的 debug binary
      # (CARGO_TARGET_DIR 指向持久卷, playwright.config.ts 读此环境变量).
      #
      # 初期 continue-on-error: true — Playwright 在 CI 环境 (无 GPU / chromium 渲染稳定性)
      # 可能有 flake, 不阻塞合并. 稳定后改为阻塞.
      #
      # 前置 (forgejo-runner-vm.mod.nix 的 VM systemPackages 已含 playwright-test nodejs python3):
      # 见 ~/ws/nixos/private/pubserv/forgejo-runner-vm.mod.nix (此 PR 不改 nixos 仓库,
      # 假设 VM 已含所需工具 — 如果 VM 缺工具, 此 step 会失败但 continue-on-error 不阻塞).
      - name: WebUI regression (Playwright)
        continue-on-error: true
        run: just check-webui

      # cargo audit: 监控依赖 CVE (项目处理 API key/token/密码, 安全敏感).
      # 工具: cargo-audit (devShell 已含; VM 通过 host-sw-bin fallback 提供).
      #
      # continue-on-error: true: 新 CVE 出现时不应阻塞正在进行的 PR (由维护者单独处理).
      # 数据库 advisory DB 拉取可能因网络抖动失败, 也不应阻塞.
      - name: cargo audit (CVE scan)
        continue-on-error: true
        run: just audit
