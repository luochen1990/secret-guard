# cargo-deny 配置: license 合规 + 依赖 bans + advisory 二次审查.
#
# 与 cargo-audit (.cargo/audit.toml) 的分工:
#   - cargo-audit: 专注 RUSTSec CVE (CI 每 PR 跑, ignore 项有严格纪律).
#   - cargo-deny:  额外覆盖 license 不兼容 + 重复 crate 多版本 + 禁止依赖,
#                  advisory 段与 cargo-audit 重叠 (互为冗余兜底, 不冲突).
#
# 项目声明 MIT license 且要发布 (nix/pkgs/secret-guard.nix), license 合规是硬约束:
# 引入 GPL/AGPL 等 copyleft 会污染下游. 本配置 allow 列表只放宽松 license.
#
# 文档: https://embarkstudios.github.io/cargo-deny/

[graph]
# 检查所有 feature (默认). secret-guard 只有一个可选 feature (consistency-check),
# 全量检查确保启用该 feature 时引入的依赖也被审查.

[advisories]
# 与 .cargo/audit.toml 的 ignore 保持一致 (SSOT 同步).
# 详尽论证见 .cargo/audit.toml.
ignore = [
  "RUSTSEC-2023-0071", # rsa Marvin Attack — 公钥验证侧不在攻击面, 见 .cargo/audit.toml
]

# ─── licenses ──────────────────────────────────────────────────────────────
# 只允许宽松 (permissive) license. copyleft (GPL/AGPL/LGPL) / 不明 license 会被 deny.
# 这是 license 合规门禁的核心 — 项目发布到 nixpkgs overlay, 不能被 copyleft 污染.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "MPL-2.0",                        # file-level copyleft (不污染链接产物)
  "CC0-1.0",                        # public domain dedication
  "CDLA-Permissive-2.0",            # webpki-roots 的 CA 根证书数据协议 (permissive, 非 copyleft)
]
# confidence-threshold: license 探测置信度下限. 默认 0.8 足够.
# 注: multiple-versions 不在此段 (0.20 schema 把它移到 [bans]), 见下方 [bans].
confidence-threshold = 0.8
# unused-allowed-license: allow 列表里没遇到实际 license 时只记 warn, 不阻断.
# 保留前瞻性 allow (未来加依赖无需每次回来改列表), 用 allow 级别消除噪音 warning.
unused-allowed-license = "allow"

# ─── bans ──────────────────────────────────────────────────────────────────
# multiple-versions = "warn": 重复 crate 只警告不阻断 (Rust 生态 duplicate 多为传递
#   依赖暂态, 强制 deny 会频繁阻塞). 跑 `just deny` 看完整列表, 维护者主动评估能否 dedupe.
# wildcards = "warn": crate 名含通配符 (如 `*`) 时警告, 防意外引入宽匹配依赖.
# 不设 deny list (当前无明确禁止的 crate).
[bans]
multiple-versions = "warn"
wildcards = "warn"

# ─── sources ───────────────────────────────────────────────────────────────
# 只允许 crates.io + 本地 path 源, 防止意外引入私有 registry / git 直链依赖
# (难审计、CI 可能拉不到). 当前所有依赖均来自 crates.io.
[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
