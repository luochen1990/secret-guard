# typos-cli 配置: 拼写检查白名单.
#
# 项目大量英文术语与中文注释混排, 默认词表对合法标识符 / test fixture 会误报.
# 本文件只收录经人工确认为合法的误报 (identifier / fixture), 不放真 typo.
#
# 字段语义:
#   [default.extend-identifiers]: 只在 "作为 identifier 出现" 时忽略 (大小写敏感全词匹配).
#                                 适合变量名 / 类型名 (不会误放过字符串里的同名子串).
#   [default.extend-words]:       作为单词出现就忽略 (不纠正). 适合 test fixture 字符串片段.
#   [default.extend-ignore-words-re]: 正则忽略, 更宽泛, 谨慎用.
#
# 维护纪律: 每项必须有注释说明为什么是误报 (合法标识符含义 / fixture 用途).

[default.extend-identifiers]
# pn = parent node (DAG 父节点变量, dag.rs 内部约定).
pn = "pn"
# thr = threshold (awk 局部变量, justfile bench-ci 解析 criterion 输出用, awk 惯用短名).
thr = "thr"

[default.extend-words]
# hel / abd = SSE 流式测试 fixture 的字符串片段 (codec/stream.rs / auth/apikey.rs),
# 非 English 单词, 是构造畸形输入验证 parser 鲁棒性的字面量, 不应被纠正.
hel = "hel"
abd = "abd"
# protocl / valeu = 静态配置审计 (#159) 的拼写错误 fixture — 测试 "did you mean"
# 拼写建议 (protocl→protocol / valeu→value) 的关键输入, 故意拼错, 不应被纠正.
protocl = "protocl"
valeu = "valeu"
# inital = 同上的深层 fixture (mock_strategy.inital → initial 建议).
inital = "inital"
# prioroty = 同上的深层 fixture (providers.routes.prioroty → priority 建议, 多规则化).
prioroty = "prioroty"
# comon = 静态配置审计 (#159) 的拼写错误 fixture — providers.endpoints entry 内
# 的 comon_uri (→ common_uri 建议), multi-endpoint schema 的端点级递归审计用,
# 故意拼错, 不应被纠正.
comon = "comon"
