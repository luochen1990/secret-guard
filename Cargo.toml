[package]
# crates.io 发布名: `secret-guard` 已被第三方抢注 (owner bigdong89, 2026-09-09),
# 定名 `secret-guard-rs` (2026-09-22 用户确认) — Rust 生态惯例后缀, 便于按 "secret
# guard rust" 检索命中. 二进制名保持 `secret-guard` ([[bin]] name), nix 包名独立
# (nix/pkgs/secret-guard.nix pname), 用户侧零感知差异:
#   cargo install secret-guard-rs  →  $CARGO_HOME/bin/secret-guard
name = "secret-guard-rs"
version = "0.1.0"
edition = "2024"
# MSRV (issue #149-5): edition 2024 要求 rustc >= 1.85, 本项目按 devShell 实际工具链
# (nixos-unstable, 当前 1.96) 声明下界. CI 与 devShell 不读此字段做强制 (工具链由
# nixpkgs 决定), 它是给 cargo 报错信息 / 依赖 resolver / 维护者的明确契约.
rust-version = "1.96"
description = "A lightweight LLM gateway that prevents accidental secret leakage"
license = "MIT"
# crates.io 发布元数据 (2026-09 开源准备; 发布名定夺见文件头注释).
repository = "https://github.com/luochen1990/secret-guard"
homepage = "https://secret-guard.lambda.lc"
# bin 型 crate 的 docs.rs 页面无意义, documentation 指向文档站 (crates.io 侧栏链接).
documentation = "https://secret-guard.lambda.lc/en/"
readme = "README.md"
keywords = ["llm", "security", "secrets", "proxy", "redaction"]
categories = ["command-line-utilities", "web-programming"]
# 大资产不进 crate 包 (demo.gif 2.1M / records-detail.webp); GitHub README 用相对路径
# 引用它们 — crates.io 渲染 README 时图片不显示, 主战场是 Git 托管平台, 可接受.
exclude = ["assets/*", "docs/*", "tests/webui/*", ".github/*", "nix/*"]

[[bin]]
name = "secret-guard"
path = "src/main.rs"

# lib target 名显式钉在 `secret_guard` (不带 _rs 后缀): package 更名 secret-guard-rs
# 不改变 crate 内部路径 (`use secret_guard::...`) 与集成测试/文档引用 — 与 [[bin]]
# name 同理, 发布名与代码标识符解耦, 单点声明.
[lib]
name = "secret_guard"

[features]
default = []
# 视图正确性热路径断言 (CI 守卫, 默认关闭避免生产开销).
# 详见 AGENTS.md "视图正确性确保机制".
consistency-check = []
# OIDC 登录链 (浏览器 WebUI 认证) 的编译开关 (#276): 默认构建不含 OIDC — 三依赖
# (openidconnect / tower-sessions / axum-login, ~90 crate 闭包) 仅在此 feature 开启
# 时进入构建图. gate 范围: src/auth/ 的 oidc/handlers/session 子模块 + server.rs 的
# /login /oauth2/callback /logout 路由与 AuthManagerLayer 装配. **不 gate**: apikey.rs
# (本地 API key 路径) 与 [auth] 配置段解析; `[auth] enabled = true` + 默认档 →
# 启动 fail-fast (AuthConfig::validate, 提示 rebuild with --features oidc).
# 详见 src/auth/mod.rs 头部.
oidc = ["dep:openidconnect", "dep:tower-sessions", "dep:axum-login"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
# gzip/brotli/deflate: 启用 reqwest 的自动解压 (上游 LLM provider 普遍支持压缩响应,
# 不启用会导致 secret-guard 拿到压缩字节 → record.resp_body 乱码 + parsed view 失败).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
  "brotli",
  "deflate",
] }
tokio = { version = "1", features = ["full"] }
# "sync" feature: 启用 wrappers::WatchStream (GET /api/events 的 SSE 失效通知
# 流消费 DAG watch 计数, rt-push). 只 gate tokio-stream 自身的 wrapper 模块,
# 不新增构建图 crate (tokio/sync 已由 tokio full 开启).
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["trace"] }
# serde "rc" 显式开启: dag/web 的 DTO 持有 Arc<str> / Arc<[(String,String)]> 并
# derive Serialize — 依赖 serde 的 rc feature. 历史上由 tower-sessions 等旧必选
# 依赖经 feature 统一传递启用, oidc optional 化 (#276) 后默认档构建图无人开启它,
# 故显式声明 (依赖自身用到的 feature 而非指望传递统一, 是正确姿势).
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
sha2 = "0.10"
rand = "0.10"

# 认证: OIDC (浏览器 WebUI) + 本地 API key (SDK 转发路径).
# OIDC 三依赖 optional 化 (feature `oidc`, #276): 默认构建只保留 API key 路径,
# 默认档构建图显著收缩 (双口径快照见 docs/dependency-watch.md). axum-login
# re-export tower-sessions core, 但 MemoryStore 需要 memory-store feature.
tower-sessions = { version = "0.14", features = [
  "memory-store",
], optional = true }
axum-login = { version = "0.18", optional = true }
openidconnect = { version = "4", default-features = false, features = [
  "reqwest",
  "rustls-tls",
], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 子串搜索 (memmem::Finder): warn_disabled_secrets_in_body 对 raw body 的多 needle
# 扫描, 替代朴素 O(n·m) 窗口比较. 已是 lock 中传递依赖 (axum / futures 等), 显式化
# 不新增构建图 crate. license MIT OR UNLICENSE, deny allow 列表已覆盖.
memchr = "2.8.3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
pretty_assertions = "1"
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
# OIDC mock IdP 集成测试 (tests/auth_oidc.rs, feature `oidc` 门控):
# 这些 crate 都已在全量档依赖树中 (rsa 经 openidconnect 传递, 其余经 rustls 链),
# 此处仅显式化以便测试直接用于生成 RSA 密钥对 + 手签 RS256 id_token. 不引入新
# 传递依赖; 默认档下 dev-deps 不进 normal 构建图 (rsa 在默认档仅因此处而存在).
# license 全部已在 deny.toml allow 列表.
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
# 集成测试构造 gzip 压缩上游响应 (验证 secret-guard 的 reqwest client 正确解压).
flate2 = "1"

# redact 性能基线 bench. 详尽设计见 benches/redact.rs 头部.
[[bench]]
name = "redact"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
