[package]
name = "secret-guard"
version = "0.1.0"
edition = "2024"
# MSRV (issue #149-5): edition 2024 要求 rustc >= 1.85, 本项目按 devShell 实际工具链
# (nixos-unstable, 当前 1.96) 声明下界. CI 与 devShell 不读此字段做强制 (工具链由
# nixpkgs 决定), 它是给 cargo 报错信息 / 依赖 resolver / 维护者的明确契约.
rust-version = "1.96"
description = "A lightweight LLM gateway that prevents accidental secret leakage"
license = "MIT"

[[bin]]
name = "secret-guard"
path = "src/main.rs"

[features]
default = []
# 视图正确性热路径断言 (CI 守卫, 默认关闭避免生产开销).
# 详见 AGENTS.md "视图正确性确保机制".
consistency-check = []

[dependencies]
axum = { version = "0.8", features = ["macros"] }
# gzip/brotli/deflate: 启用 reqwest 的自动解压 (上游 LLM provider 普遍支持压缩响应,
# 不启用会导致 secret-guard 拿到压缩字节 → record.resp_body 乱码 + parsed view 失败).
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
  "brotli",
  "deflate",
] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
sha2 = "0.10"
rand = "0.8"

# 认证: OIDC (浏览器 WebUI) + 本地 API key (SDK 转发路径).
# axum-login re-export tower-sessions core, 但 MemoryStore 需要 memory-store feature.
tower-sessions = { version = "0.14", features = ["memory-store"] }
axum-login = "0.18"
openidconnect = { version = "4", default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 子串搜索 (memmem::Finder): warn_disabled_secrets_in_body 对 raw body 的多 needle
# 扫描, 替代朴素 O(n·m) 窗口比较. 已是 lock 中传递依赖 (axum / futures 等), 显式化
# 不新增构建图 crate. license MIT OR UNLICENSE, deny allow 列表已覆盖.
memchr = "2.8.3"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
pretty_assertions = "1"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# OIDC mock IdP 集成测试 (tests/auth_oidc.rs):
# 这些 crate 都已在依赖树中 (经 openidconnect / rustls 传递), 此处仅显式化以便测试
# 直接用于生成 RSA 密钥对 + 手签 RS256 id_token. 不引入新传递依赖.
# license 全部已在 deny.toml allow 列表.
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
# 集成测试构造 gzip 压缩上游响应 (验证 secret-guard 的 reqwest client 正确解压).
flate2 = "1"

# redact 性能基线 bench. 详尽设计见 benches/redact.rs 头部.
[[bench]]
name = "redact"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
