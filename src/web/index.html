<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>secret-guard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      color: #222;
    }
    header {
      padding: 8px 16px;
      background: #1a1a1a;
      color: #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header .brand { font-weight: bold; }
    header .toolbar { display: flex; gap: 10px; align-items: center; }
    main { display: flex; height: calc(100vh - 38px); }
    aside {
      width: 340px;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      background: #fafafa;
    }
    article { flex: 1; padding: 12px; overflow-y: auto; }
    .record-item {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      line-height: 1.5;
    }
    .record-item:hover { background: #f0f0f0; }
    .record-item.active { background: #d0e7ff; }
    .method {
      display: inline-block;
      min-width: 44px;
      font-weight: bold;
    }
    .method-GET { color: #06a; }
    .method-POST { color: #060; }
    .method-PUT, .method-DELETE, .method-PATCH { color: #a00; }
    .status-ok { color: #0a0; font-weight: bold; }
    .status-err { color: #a00; font-weight: bold; }
    .status-pending { color: #888; }
    .meta { color: #888; }
    .section { margin-bottom: 18px; }
    .section h3 {
      margin: 0 0 6px 0;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    pre {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      max-height: 380px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 4px 0;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: #888;
    }
    button.refresh {
      background: transparent;
      border: 1px solid #555;
      color: #eee;
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 3px;
      font: inherit;
    }
    button.refresh:hover { background: #333; }
    label { cursor: pointer; user-select: none; }
    .badge {
      display: inline-block;
      padding: 1px 5px;
      background: #ddd;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 4px;
    }
    .badge-stream { background: #cfe; color: #060; }
    .badge-err { background: #fcc; color: #a00; }
  </style>
</head>
<body>
  <header>
    <span class="brand">secret-guard</span>
    <span class="toolbar">
      <span><span id="count">0</span> records</span>
      <label><input type="checkbox" id="auto" checked> auto-refresh (3s)</label>
      <button class="refresh" onclick="refresh()">refresh</button>
    </span>
  </header>
  <main>
    <aside id="sidebar"><div class="empty">No records yet</div></aside>
    <article id="detail"><div class="empty">Select a record on the left</div></article>
  </main>

  <script>
    let records = [];
    let selectedId = null;

    async function refresh() {
      try {
        const r = await fetch('/__sg/api/records');
        if (!r.ok) return;
        records = await r.json();
        document.getElementById('count').textContent = records.length;
        renderSidebar();
        if (selectedId) {
          const detail = await fetch('/__sg/api/records/' + selectedId);
          if (detail.ok) renderDetail(await detail.json());
        }
      } catch (e) { console.error(e); }
    }

    function renderSidebar() {
      const el = document.getElementById('sidebar');
      if (records.length === 0) {
        el.innerHTML = '<div class="empty">No records yet</div>';
        return;
      }
      el.innerHTML = records.map(r => `
        <div class="record-item ${r.id === selectedId ? 'active' : ''}" onclick="selectRecord('${r.id}')">
          <div>
            <span class="method method-${escapeHtml(r.method)}">${escapeHtml(r.method)}</span>
            <span>${escapeHtml(r.path)}</span>
          </div>
          <div>
            <span class="${statusClass(r)}">${statusText(r)}</span>
            <span class="meta">· ${r.elapsed_ms}ms · ${formatTime(r.created_at)}</span>
          </div>
        </div>
      `).join('');
    }

    function statusClass(r) {
      if (r.error) return 'status-err';
      if (r.resp_status === 0) return 'status-pending';
      if (r.resp_status >= 200 && r.resp_status < 300) return 'status-ok';
      if (r.resp_status >= 400) return 'status-err';
      return 'status-pending';
    }
    function statusText(r) {
      if (r.error) return 'ERR';
      if (r.resp_status === 0) return '...';
      return r.resp_status;
    }
    function formatTime(s) {
      try { return new Date(s).toLocaleTimeString(); }
      catch (e) { return s; }
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    async function selectRecord(id) {
      selectedId = id;
      renderSidebar();
      const r = await fetch('/__sg/api/records/' + id);
      if (r.ok) renderDetail(await r.json());
    }

    function renderDetail(r) {
      const el = document.getElementById('detail');
      const badges = [
        r.streamed ? '<span class="badge badge-stream">streamed</span>' : '',
        r.error ? '<span class="badge badge-err">' + escapeHtml(r.error) + '</span>' : '',
      ].join('');
      el.innerHTML = `
        <div class="section">
          <h3>Request</h3>
          <div><b>${escapeHtml(r.method)}</b> ${escapeHtml(r.path)}</div>
          <pre>${escapeHtml(formatHeaders(r.req_headers))}</pre>
          <pre>${escapeHtml(r.req_body || '<empty>')}</pre>
        </div>
        <div class="section">
          <h3>Response ${badges}</h3>
          <div>
            status:
            <span class="${statusClass(r)}">${r.resp_status === 0 ? '(pending)' : r.resp_status}</span>
            · ${r.elapsed_ms}ms
          </div>
          <pre>${escapeHtml(formatHeaders(r.resp_headers))}</pre>
          <pre>${escapeHtml(r.resp_body || '<empty>')}</pre>
        </div>
      `;
    }

    function formatHeaders(hs) {
      if (!hs || hs.length === 0) return '(no headers)';
      return hs.map(([k, v]) => k + ': ' + v).join('\n');
    }

    refresh();
    setInterval(() => { if (document.getElementById('auto').checked) refresh(); }, 3000);
  </script>
</body>
</html>
